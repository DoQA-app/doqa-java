name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # artifacts target Java 11 - test the floor, the LTS and a recent JDK
        java: [11, 17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B verify

  # doqa-cucumber is compiled against Cucumber 7.0.0 and tested on it in the build above;
  # this matrix runs its tests on the newer lines. Cucumber 8 and JUnit 6 need Java 17.
  cucumber:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [cucumber-7-latest, cucumber-8]
        java: [11, 17, 21]
        exclude:
          - profile: cucumber-8
            java: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw -B -pl doqa-cucumber -am verify -P${{ matrix.profile }}
